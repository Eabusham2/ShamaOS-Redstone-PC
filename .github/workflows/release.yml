name: Release downloads

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach checked downloads to
        required: true
        type: string
      candidate_run:
        description: Optional successful same-commit run containing a full-world candidate
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: shamaos-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      source_commit: ${{ steps.source.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: src
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and real generator tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys
          python -m pip install -e .
      - name: Resolve exact source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Collect exact-commit green CI and preserve all original artifacts
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          args=()
          if [ -n "$CANDIDATE_RUN" ]; then
            args+=(--candidate-run "$CANDIDATE_RUN")
          fi
          python tools/release_ci.py acquire --commit "$SOURCE_COMMIT" \
            --output build/release-input "${args[@]}"
      - name: Generate the actual full world if no accepted candidate exists
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          if [ ! -d build/release-input/candidate ]; then
            python tools/build_release_candidate.py \
              --candidate build/release-input/candidate \
              --commit "$SOURCE_COMMIT" --ci-report build/release-input/ci.json
          fi
      - name: Verify full world and make schematic, installer, ready save and guide
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          python -m shamaos.release --candidate build/release-input/candidate \
            --ci-report build/release-input/ci.json \
            --ci-artifacts build/release-input/ci-artifacts \
            --commit "$SOURCE_COMMIT" --tag "$RELEASE_TAG" --output dist/release
      - name: Save checked release downloads
        uses: actions/upload-artifact@v4
        with:
          name: checked-release-downloads-${{ steps.source.outputs.sha }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Keep diagnostic preflight on a blocked release
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blocked-release-diagnostics-${{ steps.source.outputs.sha }}
          path: |
            build/release-input/ci.json
            build/release-input/candidate/generation-preflight.json
            build/release-input/candidate/generated-manifest.json
            build/physical/generation-preflight.json
            build/physical/mapped-resource-preflight.json
          if-no-files-found: warn
          retention-days: 14

  attach:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: src
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.package.outputs.source_commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: checked-release-downloads-*
          path: dist/release
          merge-multiple: true
      - name: Attach new files and preserve every existing release asset
        run: python tools/release_ci.py upload --tag "$RELEASE_TAG" --folder dist/release
