name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # During heavyweight physical synthesis, only the newest validation for the
  # branch matters. Superseded runs are cancelled so they cannot consume the
  # runners needed by the current release candidate.
  group: shamaos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: CLI smoke
        run: |
          shamaos plan --config configs/default.toml --manifest build/plan.json
          shamaos asm examples/bitcoin_miner.asm -o build/miner.bin --listing build/miner.lst
          shamaos flash-image -o build/shamaos-flash.img
          shamaos software-usage --report build/software-usage.json

  world-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real Minecraft world backend
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y g++ libsnappy-dev
          python -m pip install "cmake>=4.1,<5"
          # Recent Amulet native dependencies require CMake 4.1. Put the
          # actual executable first: its Python shim cannot import cmake
          # inside a PEP 517 isolated dependency build.
          export PATH="$(python -c 'import cmake; print(cmake.CMAKE_BIN_DIR)'):$PATH"
          cmake --version
          CC=gcc CXX=g++ python -m pip install -e ".[dev,world]"
      - name: Validate exact functional redstone block states
        run: pytest -q tests/test_world_blockstates.py

  rtl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install HDL tools and package
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile SHA RTL
        run: |
          iverilog -g2012 -Wall -s tb_sha -o build_sha.vvp \
            rtl/sha256_compress.sv rtl/sha256_fixed64.sv rtl/bitcoin_dsha256.sv rtl/tb_sha.sv
      - name: Run SHA known-answer tests
        run: vvp build_sha.vvp
      - name: Compile CPU RTL
        run: |
          iverilog -g2012 -Wall -I rtl -s shama_cpu -o build_cpu.vvp \
            rtl/sha256_compress.sv rtl/sha256_fixed64.sv rtl/bitcoin_dsha256.sv rtl/shama_cpu.sv
      - name: Compile GPU RTL
        run: |
          iverilog -g2012 -Wall -s tb_gpu -o build_gpu.vvp \
            rtl/shama_font5x7.sv rtl/shama_gpu.sv rtl/tb_gpu.sv
      - name: Run GPU command/display test
        run: vvp build_gpu.vvp
      - name: Compile/display bridge test
        run: |
          iverilog -g2012 -Wall -s tb_display_bridge -o build_display_bridge.vvp \
            rtl/shama_display_bridge.sv rtl/tb_display_bridge.sv
          vvp build_display_bridge.vvp
      - name: Compile/ring memory-controller test
        run: |
          iverilog -g2012 -Wall -I rtl -s tb_ring_memctl -o build_memctl.vvp \
            rtl/shama_ring_memctl.sv rtl/tb_ring_memctl.sv
          vvp build_memctl.vvp

      - name: Compile input RTL
        run: |
          iverilog -g2012 -Wall -s shama_input -o build_input.vvp rtl/shama_input.sv
      - name: Partitioned black-box shell synthesis smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          from shamaos.model import Vec3
          from shamaos.synthesis import (
              MacroInstance,
              build_physical_netlist,
              synthesize_json,
          )

          rtl = [Path("rtl/synth_macro_smoke.sv")]

          child_json = synthesize_json(
              rtl,
              top="synth_macro_child",
              output_json="build/macro-child.json",
          )
          child = build_physical_netlist(
              child_json,
              top="synth_macro_child",
              origin=Vec3(-10000, 64, -10000),
          )

          shell_json = synthesize_json(
              rtl,
              top="synth_macro_shell",
              output_json="build/macro-shell.json",
              blackbox_modules=("synth_macro_child",),
          )
          shell = build_physical_netlist(
              shell_json,
              top="synth_macro_shell",
              origin=Vec3(10000, 64, -10000),
              macro_instances={
                  "u_child": MacroInstance(
                      instance_name="u_child",
                      module_type="synth_macro_child",
                      physical=child,
                  )
              },
          )

          assert child.manifest()["cell_count"] > 0
          assert shell.manifest()["cell_count"] > 0
          assert shell.manifest()["net_count"] >= 4
          assert len(shell.input_ports["clk"]) == 1
          assert len(shell.output_ports["q"]) == 1
          assert len(shell.output_ports["y"]) == 1
          print("PARTITIONED SYNTHESIS SMOKE PASS")
          PY
      - name: AIG redstone synthesis smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          from shamaos.model import Vec3
          from shamaos.synthesis import build_physical_netlist, synthesize_json

          output = synthesize_json(
              [Path("rtl/synth_smoke.sv")],
              top="synth_smoke",
              output_json="build/synth-smoke-aig.json",
              mapping_mode="aig",
          )
          physical = build_physical_netlist(
              output,
              top="synth_smoke",
              origin=Vec3(0, 64, 0),
          )
          m = physical.manifest()
          assert m["cell_count"] > 0
          assert m["net_count"] > 0
          assert m["routing_tracks"] > 0
          print("AIG REDSTONE SYNTHESIS SMOKE PASS", m)
          PY
      - name: Yosys redstone synthesis smoke
        run: |
          shamaos synth-redstone --top synth_smoke --rtl rtl/synth_smoke.sv \
            --json build/synth-smoke.json --manifest build/synth-smoke-physical.json
          python - <<'PY'
          import json
          m=json.load(open("build/synth-smoke-physical.json"))
          assert m["cell_count"] > 0
          assert m["net_count"] > 0
          assert m["routing_tracks"] > 0
          print(m)
          PY
      - name: Test ShamaOS boot and app lifecycle services
        run: |
          iverilog -g2012 -Wall -I rtl -s tb_services -o build_services.vvp \
            rtl/shama_services.sv rtl/tb_services.sv
          timeout 20s vvp build_services.vvp
      - name: Test ShamaFS accelerator
        run: |
          iverilog -g2012 -Wall -I rtl -s tb_fs_accel -o build_fs.vvp \
            rtl/shama_fs_accel.sv rtl/tb_fs_accel.sv
          timeout 30s vvp build_fs.vvp
      - name: Test in-world assembler accelerator
        run: |
          iverilog -g2012 -Wall -I rtl -s tb_asm_accel -o build_asm.vvp \
            rtl/shama_asm_accel.sv rtl/tb_asm_accel.sv
          timeout 30s vvp build_asm.vvp
      - name: Compile GUI kernel accelerator
        run: |
          iverilog -g2012 -Wall -I rtl -s shama_kernel_accel -o build_kernel.vvp rtl/shama_kernel_accel.sv
      - name: Compile integrated ShamaOS SoC
        run: |
          iverilog -g2012 -Wall -I rtl -s shama_soc -o build_soc.vvp \
            rtl/sha256_compress.sv rtl/sha256_fixed64.sv rtl/bitcoin_dsha256.sv \
            rtl/shama_cpu.sv rtl/shama_font5x7.sv rtl/shama_gpu.sv \
            rtl/shama_display_bridge.sv rtl/shama_input.sv \
            rtl/shama_onehot_ring.sv rtl/shama_ring_memctl.sv \
            rtl/shama_memory_adapter.sv rtl/shama_services.sv \
            rtl/shama_kernel_accel.sv rtl/shama_fs_accel.sv \
            rtl/shama_asm_accel.sv rtl/shama_soc.sv


  behavioral-and-redstone:
    runs-on: ubuntu-24.04
    # Full-size source boundaries and production-controller SoC persistence
    # flows extend the previous ~35-minute behavioral/redstone workload.
    timeout-minutes: 75
    env:
      PYTHONPATH: src:tests
      SHAMA_MCHPRS_RUNNER: ${{ github.workspace }}/tests/mchprs_runtime/target/release/shama-redstone-check
      SHAMA_MCHPRS_SPARSE_RUNNER: ${{ github.workspace }}/tests/mchprs_sparse_runtime/target/release/shama-sparse-world-check
      SHAMA_MCHPRS_TERRAIN_RUNNER: ${{ github.workspace }}/tests/mchprs_sparse_runtime/target/release/shama-sparse-world-check-terrain
      SHAMA_MCHPRS_DENSE_TERRAIN_RUNNER: ${{ github.workspace }}/tests/mchprs_sparse_runtime/target/release/shama-dense-world-check-terrain
      SHAMA_VALIDATION_REPORT_DIR: ${{ github.workspace }}/build/validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tests/mchprs_runtime/target
            tests/mchprs_sparse_runtime/target
          key: mchprs-runtime-${{ runner.os }}-${{ hashFiles('tests/mchprs_runtime/Cargo.lock', 'tests/mchprs_runtime/src/**', 'tests/mchprs_sparse_runtime/Cargo.lock', 'tests/mchprs_sparse_runtime/src/**', 'tests/mchprs_sparse_runtime/native-terrain-registry.patch', 'tests/mchprs_sparse_runtime/pinned-source-provenance.json', 'tools/prepare_mchprs_terrain_registry.py') }}
      - name: Install actual HDL and Python test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
          python -m pip install -e ".[dev]"
          command -v iverilog
          command -v vvp
          command -v yosys
      - name: Build pinned actual redstone engine
        run: cargo build --locked --release --manifest-path tests/mchprs_runtime/Cargo.toml
      - name: Build streamed and dense native-world terrain engines
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/tests/mchprs_sparse_runtime/target
        run: |
          cargo build --locked --release --manifest-path tests/mchprs_sparse_runtime/Cargo.toml
          cargo test --locked --release --manifest-path tests/mchprs_sparse_runtime/Cargo.toml
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          metadata = json.loads(subprocess.check_output([
              'cargo', 'metadata', '--offline', '--locked', '--format-version', '1',
              '--manifest-path', 'tests/mchprs_runtime/Cargo.toml',
          ], text=True))
          package = next(p for p in metadata['packages'] if p['name'] == 'mchprs_blocks')
          source = Path(package['manifest_path']).parents[2]
          subprocess.run([
              sys.executable, 'tools/prepare_mchprs_terrain_registry.py',
              '--source', str(source), '--output', 'build/mchprs-terrain', '--build',
          ], check=True)
          PY
      - name: Run complete behavioral and placed-block regression
        run: |
          mkdir -p build
          pytest -ra --ignore=tests/test_world_blockstates.py --junitxml=build/behavioral-results.xml
          python - <<'PY'
          from xml.etree import ElementTree as ET
          root = ET.parse('build/behavioral-results.xml').getroot()
          assert not root.findall('.//skipped'), 'Required behavior tests must not be skipped'
          assert not root.findall('.//failure')
          assert not root.findall('.//error')
          PY
      - name: Generate and independently validate saved-world fixture
        run: |
          shamaos fixture-world --world build/native-runtime-fixture --runtime-runner "$SHAMA_MCHPRS_RUNNER"
          shamaos validate-world --world build/native-runtime-fixture
          shamaos stacked-fixture-world --world build/stacked-native-runtime-fixture --runtime-runner "$SHAMA_MCHPRS_RUNNER"
          shamaos validate-world --world build/stacked-native-runtime-fixture
      - name: Archive measured fixture and exact-source validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shamaos-tested-fixture-${{ github.sha }}
          path: |
            build/behavioral-results.xml
            build/native-runtime-fixture
            build/stacked-native-runtime-fixture
            build/validation
            build/mchprs-terrain/terrain-engine-provenance.json
            build/mchprs-terrain/native-terrain-registry.patch
            build/mchprs-terrain/dense-terrain-runner/Cargo.toml
            build/mchprs-terrain/dense-terrain-runner/Cargo.lock
          retention-days: 14
          if-no-files-found: error

  full-physical-partitions:
    if: contains(github.event.head_commit.message, '[full-synth]') || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - instance: u_cpu
            module: shama_cpu
            index: 0
          - instance: u_input
            module: shama_input
            index: 1
          - instance: u_gpu
            module: shama_gpu
            index: 2
          - instance: u_display_bridge
            module: shama_display_bridge
            index: 3
          - instance: u_vram
            module: shama_vram_adapter
            index: 4
          - instance: u_services
            module: shama_services
            index: 5
          - instance: u_kernel
            module: shama_kernel_accel
            index: 6
          - instance: u_fs
            module: shama_fs_accel
            index: 7
          - instance: u_asm
            module: shama_asm_accel
            index: 8
          - instance: u_cache
            module: shama_cache_adapter
            index: 9
          - instance: u_ram
            module: shama_ram_adapter
            index: 10
          - instance: u_flash
            module: shama_flash_adapter
            index: 11
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and package
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys
          python -m pip install --upgrade pip
          pip install -e .
      - name: Synthesize physical partition
        env:
          SHAMA_INSTANCE: ${{ matrix.instance }}
          SHAMA_MODULE: ${{ matrix.module }}
          SHAMA_INDEX: ${{ matrix.index }}
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          from shamaos.layout import default_origins
          from shamaos.synthesis import build_physical_netlist, synthesize_json
          from shamaos.resource_accounting import physical_netlist_resource_lower_bound
          from shamaos.system_build import (
              SOC_RTL_FILES,
              _geometry_from_config,
              _partition_origin,
              _repo_root,
              partition_mapping_mode,
          )

          instance = os.environ["SHAMA_INSTANCE"]
          module = os.environ["SHAMA_MODULE"]
          index = int(os.environ["SHAMA_INDEX"])

          root = _repo_root()
          config = tomllib.loads(Path("configs/default.toml").read_text())
          geometry = _geometry_from_config(config)
          origin = _partition_origin(
              default_origins(geometry).control,
              index,
          )

          out_dir = Path("artifacts")
          out_dir.mkdir(parents=True, exist_ok=True)
          output = out_dir / f"partition-{instance}-{module}.json"

          synthesize_json(
              [root / p for p in SOC_RTL_FILES],
              top=module,
              output_json=output,
              repo_root=root,
              mapping_mode=partition_mapping_mode(module),
          )
          physical = build_physical_netlist(
              output,
              top=module,
              origin=origin,
              minimum_build_y=geometry.minimum_build_y,
          )
          manifest = physical.manifest()
          (out_dir / f"physical-{instance}.json").write_text(json.dumps(manifest, indent=2) + "\n")
          resources = physical_netlist_resource_lower_bound(physical)
          (out_dir / f"resources-{instance}.json").write_text(json.dumps(resources, indent=2) + "\n")
          print(json.dumps({key: manifest[key] for key in ("top", "cell_count", "net_count", "routing_tracks", "routing_planes", "trunk_track_bounds")}, indent=2))
          assert manifest["cell_count"] > 0
          assert manifest["net_count"] > 0
          assert manifest["routing_tracks"] > 0
          PY
      - name: Upload mapped partition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-soc-${{ matrix.instance }}
          path: |
            artifacts/partition-${{ matrix.instance }}-${{ matrix.module }}.json
            artifacts/partition-${{ matrix.instance }}-${{ matrix.module }}.yosys.log
            artifacts/physical-${{ matrix.instance }}.json
            artifacts/resources-${{ matrix.instance }}.json
          if-no-files-found: error
          retention-days: 14

  full-physical-synthesis:
    if: contains(github.event.head_commit.message, '[full-synth]') || github.event_name == 'pull_request'
    needs: full-physical-partitions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and package
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download mapped partitions
        uses: actions/download-artifact@v4
        with:
          pattern: full-soc-*
          path: build/full-soc
          merge-multiple: true
      - name: Reconnect physical partitions and validate complete SoC shell
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          from shamaos.layout import default_origins, memory_specs, vram_spec
          from shamaos.machine_spec import BANK_BYTES, CACHE_BYTES, FLASH_BANKS, RAM_BANKS, VRAM_BYTES
          from shamaos.model import Vec3
          from shamaos.synthesis import (
              MacroInstance,
              build_physical_netlist,
              synthesize_json,
          )
          from shamaos.system_build import (
              PARTITION_SPECS,
              PartitionedLogic,
              SOC_RTL_FILES,
              _geometry_from_config,
              _partition_origin,
              _repo_root,
          )

          root = _repo_root()
          config = tomllib.loads(Path("configs/default.toml").read_text())
          geometry = _geometry_from_config(config)
          origins = default_origins(geometry)
          build = Path("build/full-soc")

          partitions = []
          bindings = {}
          for index, (instance, module) in enumerate(PARTITION_SPECS):
              mapped = build / f"partition-{instance}-{module}.json"
              assert mapped.exists(), mapped
              physical = build_physical_netlist(
                  mapped,
                  top=module,
                  origin=_partition_origin(origins.control, index),
                  minimum_build_y=geometry.minimum_build_y,
              )
              partitions.append((instance, physical))
              bindings[instance] = MacroInstance(
                  instance_name=instance,
                  module_type=module,
                  physical=physical,
              )

          shell_json = build / "shama_soc-shell-mapped.json"
          synthesize_json(
              [root / p for p in SOC_RTL_FILES],
              top="shama_soc",
              output_json=shell_json,
              repo_root=root,
              blackbox_modules=tuple(
                  module for _instance, module in PARTITION_SPECS
              ),
          )
          shell = build_physical_netlist(
              shell_json,
              top="shama_soc",
              origin=Vec3(
                  origins.control.x + 250_000,
                  origins.control.y,
                  origins.control.z - 1_750_000,
              ),
              macro_instances=bindings,
              routing_branch_y=300,
              routing_trunk_y=304,
              minimum_build_y=geometry.minimum_build_y,
          )

          logic = PartitionedLogic(
              shell=shell,
              partitions=tuple(partitions),
          )
          m = logic.manifest()
          (build / "physical-soc-manifest.json").write_text(json.dumps(m, indent=2) + "\n")
          print(json.dumps({key: m[key] for key in ("top", "strategy", "cell_count", "net_count", "routing_tracks")}, indent=2))

          assert m["strategy"] == "partitioned-blackbox-shell"
          assert m["cell_count"] > 0
          assert m["net_count"] > 0
          assert m["routing_tracks"] > 0

          inputs = shell.input_ports
          outputs = shell.output_ports

          assert len(inputs["controller"]) == 10
          assert len(inputs["kb_rows"]) == 8
          assert len(inputs["kb_cols"]) == 8
          assert len(inputs["cache_selected_word"]) == 32
          assert len(inputs["ram_selected_word"]) == 32
          assert len(inputs["flash_selected_word"]) == 32
          assert len(inputs["vram_selected_word"]) == 32

          assert len(outputs["cache_bank_select"]) == CACHE_BYTES // BANK_BYTES
          assert len(outputs["ram_bank_select"]) == RAM_BANKS
          assert len(outputs["flash_bank_select"]) == FLASH_BANKS
          assert len(outputs["vram_bank_select"]) == VRAM_BYTES // BANK_BYTES
          assert len(outputs["cache_row_address"]) == 10
          assert len(outputs["ram_row_address"]) == 10
          assert len(outputs["flash_row_address"]) == 10
          assert len(outputs["vram_row_address"]) == 10
          assert len(outputs["display_row_data"]) == 320
          assert len(outputs["display_row_select"]) == 180

          cache, ram, flash = memory_specs(geometry)
          vram = vram_spec(geometry)
          assert cache.bank_count == CACHE_BYTES // BANK_BYTES
          assert ram.bank_count == RAM_BANKS
          assert flash.bank_count == FLASH_BANKS
          assert vram.bank_count == VRAM_BYTES // BANK_BYTES
          assert geometry.display_width == 320
          assert geometry.display_height == 180

          print("FULL PARTITIONED PHYSICAL SYNTHESIS PASS")
          PY
      - name: Preserve full synthesis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-soc-report-${{ github.sha }}
          path: |
            build/full-soc/physical-soc-manifest.json
            build/full-soc/shama_soc-shell-mapped.yosys.log
          if-no-files-found: error
          retention-days: 14
