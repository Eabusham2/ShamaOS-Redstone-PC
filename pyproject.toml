[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shamaos-redstone-pc"
version = "0.1.0"
description = "Generator, assembler, simulator and OS tooling for the ShamaOS Minecraft redstone PC."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Eabusham2"}]
dependencies = [
  "nbtlib>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]
world = [
  "amulet-core>=1.9",
]

[project.scripts]
shamaos = "shamaos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
shamaos = ["firmware/*.asm"]
